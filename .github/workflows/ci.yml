name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: invariant gates
        run: npm run gates
      - name: syntax-check experiments
        run: for f in experiments/*.mjs experiments/attic/*.mjs; do node --check "$f"; done
