name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install latest Pi and development tooling
        run: >-
          npm update
          @earendil-works/pi-agent-core
          @earendil-works/pi-ai
          @earendil-works/pi-coding-agent
          @earendil-works/pi-tui
      - run: npm ls --depth=0
      - run: npm run check
      - run: npm test
      - name: syntax-check experiments
        run: for f in experiments/*.mjs; do node --check "$f"; done
